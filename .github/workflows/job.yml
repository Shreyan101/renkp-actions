name: Jobs Test
on:
  workflow_run:
    workflows: [Basic CI, validate, Second Workflow]
    types:
      - completed
jobs:
  validate-html-file:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate html file
        run: test -f index.html

  validate-file-exist:
    # if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate navbar file
        run: test -f src/components/navBar/index.js

  validate-js-file:
    needs: ["validate-file-exist", "validate-html-file"]
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: validate js file
        run: npx eslint src/components/navBar/index.js

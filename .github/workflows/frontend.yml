name: Basic CI

on: workflow_dispatch # this github action will run when we push code

jobs:
  build:
    runs-on: ubuntu-latest # this is our build platform - the OS that will run our build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # this will checkout ( download ) our code so that we can build it

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESlint in app
        run: npm run lint

      - name: Create production build
        run: npm run build

      - name: create artifacts
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist/
          retention-days: 7
